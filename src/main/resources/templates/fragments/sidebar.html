<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar">

    <div class="sidebar-brand">Seller<span>CRM</span></div>

    <nav class="sidebar-nav">

        <div sec:authorize="hasRole('ADMIN')">
            <div class="nav-section-label">Управление</div>

            <a th:href="@{/dashboard}"
               th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                Дашборд
            </a>

            <a th:href="@{/sellers}"
               th:classappend="${activePage == 'sellers'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Продавцы
            </a>

            <a th:href="@{/transactions}"
               th:classappend="${activePage == 'transactions'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="8" y1="13" x2="16" y2="13"/>
                    <line x1="8" y1="17" x2="16" y2="17"/>
                </svg>
                Транзакции
            </a>

            <div class="nav-section-label">Аналитика</div>

            <a th:href="@{/analytics}"
               th:classappend="${activePage == 'analytics'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                </svg>
                Аналитика
            </a>
        </div>

        <div sec:authorize="hasRole('SELLER')">
            <div class="nav-section-label">Мой профиль</div>

            <a th:href="@{/my/profile}"
               th:classappend="${activePage == 'my-profile'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Профиль
            </a>

            <a th:href="@{/my/transactions}"
               th:classappend="${activePage == 'my-transactions'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="8" y1="13" x2="16" y2="13"/>
                    <line x1="8" y1="17" x2="16" y2="17"/>
                </svg>
                Транзакции
            </a>

            <a th:href="@{/my/wallet}"
               th:classappend="${activePage == 'my-wallet'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <rect x="1" y="4" width="22" height="16" rx="2"/>
                    <path d="M1 10h22"/>
                    <circle cx="17" cy="15" r="1" fill="currentColor"/>
                </svg>
                Кошелёк
            </a>

            <a th:href="@{/my/analytics}"
               th:classappend="${activePage == 'my-analytics'} ? 'active'" class="nav-link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                </svg>
                Моя аналитика
            </a>
        </div>

    </nav>

    <div class="sidebar-user">
        <div class="user-avatar" th:text="${#strings.substring(#authentication.name, 0, 1)}">U</div>
        <div class="user-info">
            <div class="user-name" sec:authentication="name">username</div>
            <div class="user-role" sec:authorize="hasRole('ADMIN')">Администратор</div>
            <div class="user-role" sec:authorize="hasRole('SELLER')">Продавец</div>
        </div>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit" title="Выйти">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16,17 21,12 16,7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </form>
    </div>

</aside>
</body>
</html>
