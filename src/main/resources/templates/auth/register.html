<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellerCRM — Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
            --accent: #4f8ef7; --accent-hover: #3a7aee;
            --text: #e8eaf0; --text-muted: #6b7280; --error: #f87171;
        }

        body {
            font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(79,142,247,0.07) 0%, transparent 60%);
        }

        .wrapper { width: 100%; max-width: 420px; padding: 0 24px; }

        .brand { text-align: center; margin-bottom: 40px; }
        .brand-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        .brand-title span { color: var(--accent); }
        .brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 300; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; }
        .card-title { font-size: 17px; font-weight: 500; margin-bottom: 28px; }

        .alert-error { padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
                       background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--error); }

        .form-group { margin-bottom: 16px; }

        label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted);
                text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }

        input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
                padding: 11px 14px; font-family: 'Sora', sans-serif; font-size: 14px;
                color: var(--text); outline: none; transition: border-color 0.2s; }

        input:focus { border-color: var(--accent); }
        .field-error { font-size: 12px; color: var(--error); margin-top: 5px; }

        .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
               border-radius: 8px; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 500;
               cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }

        .login-link { display: block; text-align: center; margin-top: 20px;
                      font-size: 13px; color: var(--text-muted); }
        .login-link a { color: var(--accent); text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand">
        <div class="brand-title">Seller<span>CRM</span></div>
        <div class="brand-sub">Создайте аккаунт продавца</div>
    </div>

    <div class="card">
        <div class="card-title">Регистрация</div>

        <div class="alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${request}">
            <div class="form-group">
                <label>Имя продавца</label>
                <input type="text" th:field="*{name}" placeholder="Введите имя"/>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="form-group">
                <label>Контактные данные</label>
                <input type="text" th:field="*{contactInfo}" placeholder="Email, телефон и т.д."/>
                <div class="field-error" th:if="${#fields.hasErrors('contactInfo')}" th:errors="*{contactInfo}"></div>
            </div>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" th:field="*{username}" placeholder="Придумайте логин"/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" th:field="*{password}" placeholder="Придумайте пароль"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button class="btn" type="submit">Зарегистрироваться</button>
        </form>
    </div>

    <div class="login-link">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
    </div>
</div>

</body>
</html>
